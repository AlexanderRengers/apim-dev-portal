openapi: 3.0.3
info:
  title: Customers API
  version: 1.0.0
  description: Simple CRUD API for customers (PoC, demo data). APIM talks directly to Azure Table Storage.
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List all customers
      responses:
        "200":
          description: List of customers (at most 1000)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          description: Subscription key missing or invalid
        "429":
          description: Rate limit exceeded
    post:
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
            example:
              name: Erika Musterfrau
              email: erika@example.com
              city: Köln
      responses:
        "201":
          description: Customer created
          headers:
            Location:
              description: Path of the new customer
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid request body
        "401":
          description: Subscription key missing or invalid
        "429":
          description: Rate limit exceeded
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      summary: Get a customer
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid id
        "401":
          description: Subscription key missing or invalid
        "404":
          description: Customer not found (error from Table Storage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
        "429":
          description: Rate limit exceeded
    put:
      operationId: replaceCustomer
      summary: Replace a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
            example:
              name: Erika Musterfrau
              email: erika@example.com
              city: Düsseldorf
      responses:
        "200":
          description: Customer replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid id or invalid request body
        "401":
          description: Subscription key missing or invalid
        "404":
          description: Customer not found (error from Table Storage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
        "429":
          description: Rate limit exceeded
    delete:
      operationId: deleteCustomer
      summary: Delete a customer
      responses:
        "204":
          description: Customer deleted
        "400":
          description: Invalid id
        "401":
          description: Subscription key missing or invalid
        "404":
          description: Customer not found (error from Table Storage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageError"
        "429":
          description: Rate limit exceeded
components:
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      description: Customer ID (seeds c001 to c005, new customers get a GUID)
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"
      example: c001
  schemas:
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        city:
          type: string
          maxLength: 100
    Customer:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        city:
          type: string
          maxLength: 100
      example:
        id: c001
        name: Erika Musterfrau
        email: erika@example.com
        city: Köln
    StorageError:
      type: object
      description: Error in Table Storage OData format, passed through unchanged.
      additionalProperties: true
